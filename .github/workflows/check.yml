name: Check publication
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm test
      - name: Check generated files
        shell: bash
        run: |
          # Editorial input commits trigger workflows that build and commit pages.
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]] && git rev-parse HEAD^ >/dev/null 2>&1; then
            changed=$(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD)
            if [[ -n "$changed" ]] && ! printf '%s\n' "$changed" | grep -Evq '^(editorial/releases/[^/]+\.json|editorial/revision\.json|editorial/event-end-dates\.json)$'; then
              echo "Editorial input commit: publication workflow validates and commits generated pages."
              exit 0
            fi
          fi
          git diff --exit-code

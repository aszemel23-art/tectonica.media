name: Publish editorial revision
on:
  push:
    branches: [main]
    paths:
      - 'editorial/revision.json'
      - 'editorial/event-end-dates.json'
      - 'scripts/editorial-revision.mjs'
      - 'scripts/build.mjs'
      - 'scripts/galleries.mjs'
      - 'assets/article.css'
      - 'assets/gallery.js'
      - '.github/workflows/publish-editorial.yml'
  # 00:00 Asia/Novosibirsk: expire events even on days without a new issue.
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tectonica-editorial-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build && npm test
      - name: Publish edited issue
        run: |
          git config user.name "TECTONICA Editorial Bot"
          git config user.email "actions@users.noreply.github.com"
          git add advertising '*.html' assets/search.json editorial/*-candidates.json feed.xml sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m "Refresh TECTONICA generated pages"
            git push origin HEAD:main
          fi
